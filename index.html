<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Photo Gallery</title>
  <link rel="icon" href="data:,">
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #382946;
  font-family: system-ui, sans-serif;
  background:
    radial-gradient(ellipse at 70% 42%, #fbe7d6 0%, transparent 62%),
    linear-gradient(156deg, #b5b9e6 4%, #e9c5e5 67%, #fbe7d6);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.2rem 1.5rem 3rem;
}

.gallery-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 1.6rem;
}

.gallery-ornament {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.35rem;
  color: #7a5899;
  font-size: 0.95rem;
}

.gallery-ornament::before,
.gallery-ornament::after {
  content: "";
  width: 2.4rem;
  height: 1px;
  background: currentColor;
  opacity: 0.4;
}

.gallery-star {
  color: #fff8e6;
  text-shadow: 0 0 8px rgba(154, 114, 192, 0.65);
}

.gallery-header h1 {
  margin: 0;
  font: italic 400 clamp(2.6rem, 6vw, 4.6rem)/1 Georgia, serif;
  letter-spacing: -0.05em;
  text-shadow: 0 1px 0 #fff9fd, 0 6px 22px rgba(255, 245, 252, 0.62);
}

main {
  width: 100%;
  max-width: 980px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#image {
  width: min(100%, 740px);
  height: 410px;
  margin: 0 auto 2rem;
  padding: 1.4rem 1.75rem;
  border: 10px solid rgba(255, 253, 255, 0.95);
  border-radius: 0.85rem;
  background-color: rgba(74, 52, 102, 0.78);
  background-image: url('');
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
  box-shadow: 0 22px 50px -18px rgba(56, 41, 70, 0.34);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  text-align: center;
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.35;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(28, 16, 44, 0.92), 0 1px 3px rgba(0, 0, 0, 0.9);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.preview-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1.15rem;
  align-items: center;
}

.preview {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  border: 6px solid rgba(255, 253, 255, 0.95);
  border-bottom-width: 14px;
  border-radius: 0.45rem;
  background: #100d17;
  box-shadow: 0 12px 26px -14px rgba(56, 41, 70, 0.42);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.preview:hover,
.preview:focus-visible {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 0 18px 34px -14px rgba(56, 41, 70, 0.52);
  border-color: #ffffff;
  outline: 2px solid #7a5899;
  outline-offset: 3px;
}

@media (max-width: 640px) {
  #image {
    height: 280px;
    font-size: 1.05rem;
  }
}

footer {
  margin-top: 1.5rem;
  font-size: 0.875rem;
}

footer a {
  color: inherit;
}
  </style>
</head>
<body>
  <header class="gallery-header">
    <span class="gallery-ornament" aria-hidden="true"><span class="gallery-star">✦</span></span>
    <h1>Solar System Photo Gallery</h1>
  </header>

  <main>
    <div id="image" aria-live="polite">Hover over an image below to display here.</div>

    <div class="preview-grid">
      <img class="preview" src="https://science.nasa.gov/wp-content/uploads/2023/04/EW0108829708G4release_mercury-jpg.webp?w=900" alt="Mercury’s cratered surface" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
      <img class="preview" src="https://science.nasa.gov/wp-content/uploads/2024/03/venus-mariner-10-pia23791-fig2.jpg?w=1024" alt="Cloud bands on Venus" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
      <img class="preview" src="https://science.nasa.gov/wp-content/uploads/2023/06/safires-epc-20240903.jpg?w=720" alt="Earth with the Americas in view" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
      <img class="preview" src="https://assets.science.nasa.gov/dynamicimage/assets/science/cds/general/images/pia17305/PIA17305~orig.jpg?w=1024&amp;h=576&amp;fit=clip" alt="Mars with its moons Phobos and Deimos" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
      <img class="preview" src="https://assets.science.nasa.gov/dynamicimage/assets/science/cds/general/images/2024/03/saturn-farewell-pia21345.jpg?w=1024&amp;h=1024&amp;fit=clip" alt="Saturn and its rings" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
      <img class="preview" src="https://assets.science.nasa.gov/dynamicimage/assets/science/psd/solar/2023/09/p/i/a/0/PIA01492-1.jpg?w=1024&amp;h=1024&amp;fit=clip" alt="Neptune’s blue disk and wispy clouds" tabindex="0"
        onmouseenter="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">
    </div>
  </main>

  <footer><a href="https://science.nasa.gov/gallery/our-solar-system-images/">NASA image credits</a></footer>
  <script>
function upDate(previewPic) {
  const imageDiv = document.getElementById("image");
  imageDiv.textContent = previewPic.alt;
  imageDiv.style.backgroundImage = `url("${previewPic.src}")`;
}

function undo() {
  const imageDiv = document.getElementById("image");
  imageDiv.style.backgroundImage = "url('')";
  imageDiv.textContent = "Hover over an image below to display here.";
}
  </script>
 
  -->
</body>
</html>
